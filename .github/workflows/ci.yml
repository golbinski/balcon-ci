name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install --quiet ".[dev]"

      - name: ruff check
        run: ruff check harness/ prompts/

      - name: ruff format --check
        run: ruff format --check harness/
