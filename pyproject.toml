[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balcon-ci"
version = "0.1.0"
description = "Agentic code review and analysis pipeline for GitHub Actions"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30",
    "pydantic>=2.0",
    "PyGithub>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]>=0.30"]
foundry = ["azure-identity>=1.15"]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "PLC", # pylint convention (includes PLC0415 used in codebase)
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",    # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[project.scripts]
balcon-ci = "harness.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
